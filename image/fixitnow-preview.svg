<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="270" x2="800" y2="270" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="160" y1="0" x2="160" y2="450" />
    <line x1="320" y1="0" x2="320" y2="450" />
    <line x1="480" y1="0" x2="480" y2="450" />
    <line x1="640" y1="0" x2="640" y2="450" />
  </g>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="150" r="140" fill="#0284c7" opacity="0.22" filter="url(#glow)" />
  <circle cx="620" cy="280" r="130" fill="#6366f1" opacity="0.25" filter="url(#glow)" />

  <!-- App Window Mockup Frame -->
  <g transform="translate(60, 45)">
    <!-- Window Container -->
    <rect width="680" height="360" rx="14" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />
    
    <!-- Window Header -->
    <rect width="680" height="42" rx="14" fill="rgba(15, 23, 42, 0.9)" />
    <rect y="28" width="680" height="14" fill="rgba(15, 23, 42, 0.9)" />
    <line x1="0" y1="42" x2="680" y2="42" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="24" cy="21" r="5.5" fill="#ef4444" />
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b" />
    <circle cx="60" cy="21" r="5.5" fill="#10b981" />
    
    <!-- App Brand -->
    <text x="95" y="26" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="13" letter-spacing="0.5">FixItNow</text>
    <rect x="165" y="13" width="75" height="16" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="0.8" />
    <text x="202" y="24.5" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="9" text-anchor="middle">MERN STACK</text>

    <!-- App Search Bar Mockup -->
    <rect x="360" y="10" width="280" height="22" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
    <text x="375" y="25" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">🔍 Search home repairs, plumbing, electrical...</text>

    <!-- Hero Content in App -->
    <g transform="translate(30, 68)">
      <text x="0" y="28" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="800" font-size="22">On-Demand Service &amp; Repair Platform</text>
      <text x="0" y="52" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">Find verified technicians for instant booking, transparent pricing &amp; tracking.</text>

      <!-- Category Badges -->
      <g transform="translate(0, 72)">
        <rect x="0" y="0" width="105" height="28" rx="14" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
        <text x="52" y="18" fill="#38bdf8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">🔧 Plumbing</text>

        <rect x="115" y="0" width="115" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="#818cf8" stroke-width="1" />
        <text x="172" y="18" fill="#818cf8" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">⚡ Electrical</text>

        <rect x="240" y="0" width="115" height="28" rx="14" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
        <text x="297" y="18" fill="#10b981" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">❄️ AC Service</text>

        <rect x="365" y="0" width="115" height="28" rx="14" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-width="1" />
        <text x="422" y="18" fill="#f43f5e" font-family="'Inter', sans-serif" font-weight="600" font-size="11" text-anchor="middle">🛠️ Appliance</text>
      </g>

      <!-- Cards Grid inside App Mockup -->
      <g transform="translate(0, 118)">
        <!-- Service Card 1 -->
        <rect x="0" y="0" width="195" height="145" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <rect x="12" y="12" width="36" height="36" rx="8" fill="rgba(56, 189, 248, 0.12)" />
        <text x="30" y="35" font-size="18" text-anchor="middle">💧</text>
        <text x="56" y="27" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Master Plumbing</text>
        <text x="56" y="42" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">⭐ 4.9 (128 reviews)</text>
        <line x1="12" y1="60" x2="183" y2="60" stroke="rgba(255, 255, 255, 0.06)" />
        <text x="12" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Leak detection, pipe install</text>
        <text x="12" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Emergency 24/7 service</text>
        <rect x="12" y="108" width="171" height="24" rx="6" fill="#0284c7" />
        <text x="97" y="124" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Book Technician</text>

        <!-- Service Card 2 -->
        <rect x="212" y="0" width="195" height="145" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <rect x="224" y="12" width="36" height="36" rx="8" fill="rgba(99, 102, 241, 0.12)" />
        <text x="242" y="35" font-size="18" text-anchor="middle">💡</text>
        <text x="268" y="27" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Home Electrical</text>
        <text x="268" y="42" fill="#818cf8" font-family="'Inter', sans-serif" font-size="10">⭐ 5.0 (94 reviews)</text>
        <line x1="224" y1="60" x2="395" y2="60" stroke="rgba(255, 255, 255, 0.06)" />
        <text x="224" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Wiring, circuits, breaker fix</text>
        <text x="224" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Certified technicians</text>
        <rect x="224" y="108" width="171" height="24" rx="6" fill="#4f46e5" />
        <text x="309" y="124" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Book Technician</text>

        <!-- Service Card 3 / Dashboard Widget -->
        <rect x="424" y="0" width="196" height="145" rx="10" fill="rgba(15, 23, 42, 0.6)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <rect x="436" y="12" width="36" height="36" rx="8" fill="rgba(16, 185, 129, 0.12)" />
        <text x="454" y="35" font-size="18" text-anchor="middle">🛡️</text>
        <text x="480" y="27" fill="#f8fafc" font-family="'Inter', sans-serif" font-weight="700" font-size="12">Role-Based Auth</text>
        <text x="480" y="42" fill="#10b981" font-family="'Inter', sans-serif" font-size="10">JWT + Firebase Sec</text>
        <line x1="436" y1="60" x2="608" y2="60" stroke="rgba(255, 255, 255, 0.06)" />
        <text x="436" y="80" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Customer &amp; Provider Portal</text>
        <text x="436" y="96" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Live Schedule Management</text>
        <rect x="436" y="108" width="172" height="24" rx="6" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
        <text x="522" y="124" fill="#10b981" font-family="'Inter', sans-serif" font-weight="600" font-size="10" text-anchor="middle">Live Status: Active</text>
      </g>
    </g>
  </g>
</svg>

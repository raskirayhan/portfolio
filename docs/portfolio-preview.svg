<svg width="1440" height="720" viewBox="0 0 1440 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Portfolio preview</title>
  <desc id="desc">A dark portfolio preview with a gradient hero, project cards, and a stats rail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#060816" />
      <stop offset="0.55" stop-color="#111A3A" />
      <stop offset="1" stop-color="#07111F" />
    </linearGradient>
